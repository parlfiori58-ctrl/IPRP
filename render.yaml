services:
  - type: web
    name: iprp-bot-portale-fdo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATA_DIR
        value: /var/data
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PORTALE_FDO_URL
        sync: false
      - key: PORTALE_USER
        value: fdo
      - key: PORTALE_PASSWORD
        sync: false
    disk:
      name: iprp-data
      mountPath: /var/data
      sizeGB: 1
